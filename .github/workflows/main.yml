name: CI/CD - Colegio Johan Kepler

# 1. ¿Cuándo se va a ejecutar este flujo?
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar el código del repositorio en la máquina virtual de GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Paso 2: Configurar Bun de forma nativa en el flujo de automatización
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Paso 3: Instalar las dependencias de forma ultra-rápida usando tu bun.lockb
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Paso 4: Validar que el código de Astro compile correctamente sin errores
      - name: Build project
        run: bun run build
